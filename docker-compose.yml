version: '3.8'

# ==============================================================================
# Ethiroli Multi-Replica Containerized Load Balancing Architecture
# Run: docker compose up -d --scale backend=3
# ==============================================================================

services:
  # 1. High-Availability Nginx Load Balancer
  loadbalancer:
    image: nginx:alpine
    container_name: ethiroli_lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/loadbalancer.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/ethiroli/frontend/dist:ro
    depends_on:
      - backend
    networks:
      - ethiroli_network

  # 2. Scalable Backend API Worker Instances (Replicas)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=Admin@123
      - DB_NAME=ethiroli
      - CLUSTER_MODE=false
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    depends_on:
      - mysql
    networks:
      - ethiroli_network

  # 3. Relational Database Tier
  mysql:
    image: mysql:8.0
    container_name: ethiroli_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: ethiroli
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ethiroli_network

networks:
  ethiroli_network:
    driver: bridge

volumes:
  mysql_data:
