# ==============================================================================
# Ethiroli Platform - Nginx High-Availability Load Balancer Configuration
# Architecture: Layer 7 Reverse Proxy & Load Balancer with WebSocket Support
# ==============================================================================

# 1. Upstream Cluster Definition
# Balances traffic across multiple Node.js worker processes or server nodes.
upstream ethiroli_backend_cluster {
    # Strategy: least_conn directs new requests to the instance with the fewest active connections
    least_conn;

    # Primary backend instances
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s weight=1;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s weight=1;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=10s weight=1;
    server 127.0.0.1:5003 max_fails=3 fail_timeout=10s weight=1;

    # Persistent connection pool to backend workers (avoids TCP socket churn)
    keepalive 64;
}

# 2. Rate Limiting Zones (DDoS & Brute-force mitigation)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# 3. HTTP Server (Redirect HTTP to HTTPS in production)
server {
    listen 80;
    listen [::]:80;
    server_name ethiroli.net www.ethiroli.net localhost;

    # Health check probe for load balancers / cloud infrastructure (unauthenticated)
    location /health {
        proxy_pass http://ethiroli_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. HTTPS Secure Load Balancer Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ethiroli.net www.ethiroli.net localhost;

    # SSL/TLS Hardening
    ssl_certificate /etc/nginx/ssl/ethiroli.crt;
    ssl_certificate_key /etc/nginx/ssl/ethiroli.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression for Optimal Latency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Client payload size (Allows file uploads like resumes and course materials)
    client_max_body_size 50M;

    # Static Frontend Serving (Vite Production Build)
    root /var/www/ethiroli/frontend/dist;
    index index.html;

    # 4.1 Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 4.2 Immutable Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 4.3 API Reverse Proxy to Load-Balanced Backend Cluster
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://ethiroli_backend_cluster;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffer Optimization
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Pass load balancer tracing headers
        proxy_pass_header X-Worker-Pid;
        proxy_pass_header X-Worker-Id;
    }

    # 4.4 Versioned API Proxy (/v1/)
    location /v1/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://ethiroli_backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_pass_header X-Worker-Pid;
        proxy_pass_header X-Worker-Id;
    }

    # 4.5 Dedicated Auth Endpoint Rate Limiting
    location /v1/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://ethiroli_backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4.6 WebSocket Proxy for Real-Time Synchronization (Socket.IO)
    location /socket.io/ {
        proxy_pass http://ethiroli_backend_cluster;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-polling / persistent WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # 4.7 Health Probes (Direct cluster check, unauthenticated)
    location /health {
        proxy_pass http://ethiroli_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
